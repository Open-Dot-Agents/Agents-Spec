name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  specification:
    name: Specification conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install conformance validator
        run: python3 -m pip install -r conformance/requirements.txt
      - name: Lint Python scripts
        run: |
          python3 -m pip install ruff==0.16.8
          python3 -m ruff check conformance
      - name: Run conformance suite
        run: python3 conformance/run.py
      - name: Check experimental security schemas
        run: python3 conformance/security_draft.py
      - name: Check experimental native schemas
        run: python3 conformance/native_draft.py
